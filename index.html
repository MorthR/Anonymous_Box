<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Box</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #d4c5b3;
        }
        .paper-box {
            background: #c29b62;
            box-shadow: 0 25px 50px -12px rgba(67, 40, 16, 0.45);
            border: 2px solid #a37d46;
        }
        .cardboard-tape {
            background: rgba(212, 175, 118, 0.75);
        }
        .box-slit {
            background: #2a1b0e;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.9);
        }
        .sticky-note {
            background: #f3edc1;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.25);
        }
        @keyframes insertIntoBox {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            40% { transform: translateY(-40px) scale(0.9) rotate(-3deg); opacity: 0.95; }
            100% { transform: translateY(180px) scale(0.1) rotate(6deg); opacity: 0; }
        }
        .anim-insert { animation: insertIntoBox 0.85s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-6 px-4">
    <header class="w-full max-w-md mx-auto flex justify-between items-center bg-white/40 backdrop-blur-sm p-3 rounded-2xl mb-4 shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-600 animate-pulse"></span>
            <span id="box-tag-display" class="text-xs font-mono font-bold text-amber-950">BOX: LOADING...</span>
        </div>
        <button onclick="copyShareLink()" class="px-3 py-1.5 bg-amber-900 text-amber-100 text-xs font-medium rounded-xl shadow">Copy Link</button>
    </header>

    <main class="w-full max-w-md mx-auto flex-grow flex flex-col justify-center">
        <div id="cardboard-box" class="paper-box rounded-3xl p-6 relative overflow-hidden">
            <div class="w-full mb-6 flex flex-col items-center">
                <div class="w-56 h-3.5 box-slit rounded-full relative flex items-center justify-center">
                    <div class="w-48 h-1 bg-black/60 rounded-full"></div>
                </div>
                <span class="text-[10px] font-mono font-bold text-amber-950/60 uppercase tracking-widest mt-1.5">PARCEL SLOT</span>
            </div>

            <div id="sticky-note-card" class="sticky-note rounded-2xl p-5 relative border border-yellow-300/60">
                <div class="text-xs font-mono text-amber-900/60 mb-2 flex justify-between">
                    <span>ANONYMOUS NOTE</span>
                    <span id="char-count">0/300</span>
                </div>
                <textarea id="question-input" rows="4" maxlength="300" placeholder="Ask me anything anonymously..." class="w-full bg-transparent text-amber-950 placeholder-amber-900/40 text-sm focus:outline-none resize-none" oninput="updateCharCount()"></textarea>
                <div class="flex justify-end mt-3 pt-2 border-t border-amber-900/10">
                    <button id="submit-btn" onclick="submitQuestion()" class="px-5 py-2 bg-amber-900 text-amber-50 text-xs font-bold rounded-xl shadow">Put into Box</button>
                </div>
            </div>

            <div id="success-view" class="hidden py-8 flex flex-col items-center text-center space-y-3">
                <p class="text-sm font-bold text-amber-950">The note has been dropped into the box!</p>
                <button onclick="resetNoteForm()" class="text-xs font-bold text-amber-900 underline">Send another note</button>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-md mx-auto pt-6">
        <div id="lock-panel" class="bg-white/40 rounded-2xl p-3.5 flex items-center justify-between shadow-sm">
            <span class="text-xs font-bold text-amber-950">Owner Inbox</span>
            <div class="flex space-x-1.5">
                <input type="password" id="pass-input" placeholder="Password" class="w-24 px-2 py-1 bg-white border rounded-lg text-xs">
                <button onclick="unlockBoxInbox()" class="px-3 py-1 bg-amber-900 text-amber-100 text-xs font-bold rounded-lg">Unlock</button>
            </div>
        </div>
        <div id="unlocked-inbox" class="hidden space-y-3 mt-4">
            <div class="flex justify-between items-center px-1">
                <span class="text-xs font-bold text-amber-950">Received <span id="msg-count">0</span> notes</span>
                <button onclick="loadMessages()" class="text-xs font-bold text-amber-900 underline">Refresh</button>
            </div>
            <div id="message-list" class="space-y-3 max-h-72 overflow-y-auto pr-1"></div>
        </div>
    </footer>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-amber-950 text-amber-100 text-xs px-4 py-2 rounded-full opacity-0 transition-opacity">Link copied to clipboard</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let CURRENT_BOX_ID = urlParams.get('box');
        if (!CURRENT_BOX_ID) {
            CURRENT_BOX_ID = 'box_' + Math.random().toString(36).substring(2, 8);
            window.history.replaceState({}, '', `?box=${CURRENT_BOX_ID}`);
        }
        document.getElementById('box-tag-display').innerText = `BOX: ${CURRENT_BOX_ID.toUpperCase()}`;
        const DEFAULT_PASS = '123456';

        function updateCharCount() {
            document.getElementById('char-count').innerText = `${document.getElementById('question-input').value.length}/300`;
        }

        const STORAGE_KEY = `paperbox_data_${CURRENT_BOX_ID}`;

        function getCloudMessages() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch(e) { return []; }
        }

        function saveCloudMessage(content) {
            const list = getCloudMessages();
            list.unshift({
                id: Date.now(),
                content: content,
                dateStr: new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function submitQuestion() {
            const input = document.getElementById('question-input');
            const text = input.value.trim();
            if (!text) { alert('Please write something on the note first!'); return; }

            document.getElementById('sticky-note-card').classList.add('anim-insert');
            saveCloudMessage(text);

            setTimeout(() => {
                document.getElementById('sticky-note-card').classList.add('hidden');
                document.getElementById('sticky-note-card').classList.remove('anim-insert');
                document.getElementById('success-view').classList.remove('hidden');
            }, 800);
        }

        function resetNoteForm() {
            document.getElementById('question-input').value = '';
            updateCharCount();
            document.getElementById('success-view').classList.add('hidden');
            document.getElementById('sticky-note-card').classList.remove('hidden');
        }

        function unlockBoxInbox() {
            if (document.getElementById('pass-input').value === DEFAULT_PASS) {
                document.getElementById('lock-panel').classList.add('hidden');
                document.getElementById('unlocked-inbox').classList.remove('hidden');
                loadMessages();
            } else {
                alert('Incorrect password! Default is 123456');
            }
        }

        function loadMessages() {
            const list = getCloudMessages();
            document.getElementById('msg-count').innerText = list.length;
            const container = document.getElementById('message-list');
            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-amber-900/60 font-bold">The box is empty</div>`;
                return;
            }
            container.innerHTML = list.map(item => `
                <div class="sticky-note p-3.5 rounded-xl border border-yellow-400 flex justify-between items-start gap-2">
                    <div>
                        <p class="text-xs text-amber-950 break-all">${item.content}</p>
                        <span class="text-[10px] text-amber-950/50">${item.dateStr}</span>
                    </div>
                    <button onclick="deleteMsg(${item.id})" class="text-red-600 text-xs">Delete</button>
                </div>
            `).join('');
        }

        function deleteMsg(id) {
            let list = getCloudMessages().filter(i => i.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            loadMessages();
        }

        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href);
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }
    </script>
</body>
</html>
